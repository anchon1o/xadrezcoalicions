/* ===== Estética "Cartel": modernismo vienés, 1920 ===== */
:root{
  /* xeométrica, como o subtítulo do cartel: lexible e integrada */
  --sans:"Cartel Texto","Poppins","Futura","Avenir Next","Century Gothic",ui-sans-serif,sans-serif;
  /* condensada pesada, como o título do cartel */
  --disp:"Cartel Titulo","Avenir Next Condensed","Arial Narrow",var(--sans);
  --y:#F0B800; --r:#D8382A; --g:#2C8A55; --b:#1F2228;
  --paper:#EDEAE2; --ink:#12141A; --mut:#6B6E76; --rule:#CFCBC0;
  --light:#F4E6C3; --dark:#CFAE7A; --panel:#EDEAE2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:var(--disp);cursor:pointer;border:0;border-radius:0;background:var(--ink);
  color:var(--paper);font-weight:700;font-size:16px;letter-spacing:.02em;text-transform:uppercase;padding:12px 16px}
button:active{opacity:.82}
button:disabled{opacity:.28;cursor:default}
button:focus-visible{outline:3px solid var(--r);outline-offset:2px}
button.p{background:var(--y);color:var(--ink)}
button.ghost{background:transparent;color:var(--ink);padding:8px 10px;font-size:18px;font-weight:600}
button.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}

header{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 14px 0;background:var(--paper)}
header h1{font-family:var(--disp);font-size:17px;margin:0;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:6px}
header h1 span{display:inline-block;width:9px;height:9px;border-radius:0;margin-left:0}
header h1 span:first-of-type{margin-left:4px}
.hdrbtns{display:flex;gap:2px}

.status{display:flex;align-items:stretch;height:44px;margin:12px 0 0;background:var(--ink);color:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:0 12px;font-weight:700;font-size:14px;
  font-family:var(--disp);letter-spacing:.03em;text-transform:uppercase;background:transparent;color:inherit}
.chip.now{color:#fff}
.chip.rd{margin-left:auto;font-weight:500;font-size:12.5px;opacity:.6;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ph{background:var(--y);color:var(--ink);font-size:11px;line-height:1.1;max-width:44%}
.dot{width:11px;height:11px;display:inline-block;flex:none}

.main{display:grid;grid-template-rows:auto 1fr;min-height:0}
.boardwrap{display:flex;justify-content:center;align-items:center;padding:8px 10px;min-height:0;min-width:0;overflow:hidden}
.bframe{display:grid;grid-template-columns:19px var(--lado,300px);grid-template-rows:var(--lado,300px) 19px;
  transition:transform .35s ease}
.ranks{display:grid;grid-template-rows:repeat(10,1fr);height:var(--lado,300px)}
.files{display:grid;grid-template-columns:repeat(10,1fr);width:var(--lado,300px)}
.ranks span,.files span{display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.bcorner{}
.board{position:relative;width:var(--lado,300px);height:var(--lado,300px);flex:none;
  border:3px solid var(--ink);overflow:hidden;display:grid;
  grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);background:var(--dark);
  user-select:none;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.l{background:var(--claro,var(--light))} .sq.d{background:var(--escuro,var(--dark))}
.sq .zone{position:absolute;inset:0;pointer-events:none;opacity:.22}
.sq .alia{position:absolute;pointer-events:none;opacity:.85}
.sq .alia-Y{left:0;right:0;top:0;height:9%}        /* Amarelo abaixo: franxa no lado de arriba */
.sq .alia-B{left:0;right:0;bottom:0;height:9%}     /* Negro arriba: franxa abaixo */
.sq .alia-R{top:0;bottom:0;right:0;width:9%}       /* Vermello á esquerda: franxa á dereita */
.sq .alia-G{top:0;bottom:0;left:0;width:9%}        /* Verde á dereita: franxa á esquerda */
.sq .corner{position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(45deg,var(--ink) 0 3px,transparent 3px 9px)}
.sq .coord{position:absolute;font-size:9px;font-weight:700;opacity:.5;pointer-events:none}
.sq .cf{left:2px;bottom:1px}.sq .cr{right:2px;top:1px}
.sq svg{width:86%;height:86%;pointer-events:none}
.sq img.pz{width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.sq.last{box-shadow:inset 0 0 0 3px rgba(18,20,26,.28)}
/* destino libre: punto redondo con anel claro, para que se lea en casa clara e escura */
.sq .mv{position:absolute;width:30%;height:30%;border-radius:50%;pointer-events:none;
  background:rgba(18,20,26,.55);
  box-shadow:0 0 0 2px rgba(255,255,255,.55), 0 1px 2px rgba(0,0,0,.25)}
/* captura: anel redondo aberto que deixa ver a peza que hai debaixo */
.sq .cap{position:absolute;inset:6%;border-radius:50%;pointer-events:none;
  border:5px solid var(--r);
  box-shadow:0 0 0 2px rgba(255,255,255,.5), inset 0 0 0 2px rgba(255,255,255,.35)}
.sq.sel{outline:none;box-shadow:inset 0 0 0 4px var(--y), inset 0 0 0 6px rgba(18,20,26,.55)}
.sq.check{background:#F3B3AD !important}
.sq.zonepick{outline:2px dashed var(--ink);outline-offset:-2px}

.panel{background:var(--paper);border-top:3px solid var(--ink);padding:14px;
  display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:42vh;overflow:auto}
.msg{font-weight:500;font-size:14px;line-height:1.5;min-height:1.4em}
.actions{display:flex;flex-wrap:wrap;gap:7px}
.actions button{flex:1 1 auto;min-width:96px;font-size:14px;padding:11px 12px}
.actions button.ghost{flex:0 0 auto;min-width:0;font-size:13px;font-weight:600;color:var(--mut)}
.coal{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.coal .chip.par{background:var(--ink);color:#fff;height:32px;font-size:13px;flex:1 1 auto;min-width:0;gap:6px}
.coal .mais{opacity:.55;margin:0 2px}
.coal .pend{opacity:.55;font-weight:400;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:12px}
.coal .vs{font-family:var(--disp);font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.coal .chip{background:var(--ink);color:#fff;height:32px;font-size:13px;flex:1;min-width:140px}
.log{font-size:12px;line-height:1.6;display:flex;flex-wrap:wrap;gap:3px 12px;color:var(--mut);
  font-variant-numeric:tabular-nums}
.log b{font-weight:900}

@media (orientation:landscape) and (min-width:700px){
  .app{grid-template-rows:auto 1fr}
  .main{grid-template-rows:none;grid-template-columns:1fr minmax(268px,370px)}
  .app.left .main{grid-template-columns:minmax(268px,370px) 1fr}
  .app.left .panel{order:-1;border-right:3px solid var(--ink);border-left:0}
  .boardwrap{align-items:center}
  .boardcol{display:grid;grid-template-rows:auto 1fr;min-height:0}
  
  .panel{border-top:0;border-left:3px solid var(--ink);max-height:none;height:100%}
}
@media (orientation:portrait), (max-width:699px){ .boardcol{display:contents} }


/* ===== en liña ===== */
.cod{font-family:var(--disp);letter-spacing:.14em;background:var(--y);padding:2px 10px}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:10px}
.seat{border:2px solid var(--ink);padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:52px;
  background:transparent;color:var(--ink);font-family:var(--sans);font-size:14px;text-transform:none;letter-spacing:0;
  font-weight:500;text-align:left;justify-content:flex-start}
.seat .dot{width:14px;height:14px;flex:none}
.seat b{font-family:var(--disp);letter-spacing:.03em;text-transform:uppercase;font-size:14px}
.seat small{color:var(--mut);display:block;font-size:12px}
.seat.mine{background:var(--ink);color:var(--paper)} .seat.mine small{color:#B9B6B0}
.seat.taken{opacity:.85}
.seatwrap{position:relative}
.seat{width:100%;position:relative}
.seatx{margin-left:auto;font-size:13px;opacity:.6}
.seatbot{position:absolute;top:6px;right:6px;width:30px;height:26px;padding:0;border-radius:0;
  background:var(--y);font-size:14px;line-height:1;border:2px solid var(--ink);z-index:2}
.seatlib{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;border-radius:0;
  background:var(--r);color:#fff;font-size:13px;line-height:1;border:2px solid var(--ink);z-index:2}
.chatbox{border:2px solid var(--ink);height:120px;overflow:auto;padding:8px 10px;font-size:13.5px;line-height:1.45;
  background:#fff;margin:0 20px}
.chatbox div b{font-weight:700} .chatbox div i{color:var(--mut);font-style:normal;font-size:11.5px;margin-left:6px}
.chatwrap{display:flex;flex-direction:column;gap:6px}
.chatwrap[hidden]{display:none}
.chatwrap .chatbox{margin:0;height:96px}
.turno-mio .board{outline:3px solid var(--y);outline-offset:3px}

/* ===== modais ===== */
.modal{position:fixed;inset:0;background:rgba(18,20,26,.62);display:none;align-items:flex-end;
  justify-content:center;z-index:40;padding-top:env(safe-area-inset-top,0)}
.modal.open{display:flex}
.card{background:var(--paper);width:100%;max-width:560px;max-height:86vh;max-height:86dvh;
  overflow:auto;overscroll-behavior:contain;padding:0 0 26px;border-top:4px solid var(--ink);
  position:relative;-webkit-overflow-scrolling:touch}
/* cabeceira pegada: o X está sempre á man, por moito que baixes */
.chead{position:sticky;top:0;z-index:3;background:var(--paper);display:flex;align-items:center;
  justify-content:space-between;gap:10px;border-bottom:3px solid var(--ink);margin:0;
  padding:14px 10px 12px 20px}
.chead h2{padding:0;margin:0;border:0}
.chead .close{float:none;margin:0;padding:8px 12px;font-size:22px;line-height:1;flex:none}
.card>*{padding-left:20px;padding-right:20px}
.card h2{font-family:var(--disp);margin:0;padding-top:20px;padding-bottom:14px;font-size:33px;
  font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.card h3{font-family:var(--disp);margin:20px 0 6px;font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.card p,.card li{line-height:1.6;font-size:14.5px;font-weight:400;color:#31343C}
.card .close{float:right;margin:14px 10px 0 0;padding:6px 10px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:nowrap;
  padding-top:13px;padding-bottom:13px;border-top:2px solid var(--ink);margin:0}
.row:first-of-type{border-top:0}
label{font-weight:500;font-size:14.5px;flex:1 1 auto;min-width:0}
label .hint{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px;line-height:1.3}
.row select{flex:0 0 auto;max-width:52%}
.row.stack{flex-direction:column;align-items:stretch;gap:8px}
.row.stack label{flex:none}
.campo{width:100%;box-sizing:border-box;font:inherit;font-size:15px;border:2px solid var(--ink);padding:9px 10px;background:#fff;min-width:0}
.cod-in{font-family:var(--disp);font-size:22px;letter-spacing:.22em;text-transform:uppercase;text-align:center;padding:6px 10px}
.unir{display:flex;gap:8px;width:100%}
.unir .campo{flex:1 1 auto}
.unir button{flex:0 0 auto}
.card{min-width:0;box-sizing:border-box}
.card>*{min-width:0;max-width:100%;box-sizing:border-box}
.row input[type=checkbox]{flex:0 0 auto}
select{font:inherit;font-size:13.5px;font-weight:600;border:2px solid var(--ink);border-radius:0;
  padding:7px 8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--ink)}
.botrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.botrow button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;
  background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--rule);font-size:12px}
.botrow button .dot{width:14px;height:14px}
.botrow button.on{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.botrow button.on small{font-weight:700}
.botrow small{font-family:var(--sans);font-weight:500;text-transform:none;letter-spacing:0;font-size:11px}
.flags{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;padding:2px 0 6px;flex:1 1 100%;
  scrollbar-width:none}
.flags::-webkit-scrollbar{display:none}
.flag{flex:0 0 auto;scroll-snap-align:start;background:transparent;border:0;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;cursor:pointer;
  text-transform:none;letter-spacing:0}
.flag svg{width:56px;height:auto;display:block;border:2px solid var(--rule);box-sizing:content-box}
.flag span{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--mut)}
.flag.on svg{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.flag.on span{color:var(--ink);font-weight:700}
.diag{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px;padding-top:6px}
.diag figure{margin:0;text-align:center}
.diag figcaption{font-size:12px;font-weight:700;margin-top:3px;font-family:var(--disp);
  letter-spacing:.03em;text-transform:uppercase;font-size:14px}
.pz-fig{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pz-fig svg{transition:outline-color .15s}
.pz-fig:hover svg,.pz-fig:focus-visible svg{outline:3px solid var(--r);outline-offset:-3px}
.pz-fig:focus{outline:none}
.pz-fig .movtxt{display:none;text-align:left;font-size:13.5px;line-height:1.5;font-weight:400;
  margin:7px 0 2px;padding:9px 11px;background:#fff;border:2px solid var(--ink)}
.pz-fig.aberta{grid-column:1/-1}
.pz-fig.aberta svg{max-width:150px;margin:0 auto}
.pz-fig.aberta .movtxt{display:block}
.movhint{font-size:12.5px;color:var(--mut);margin:2px 0 8px;font-weight:500}
.diag svg{width:100%;border:2px solid var(--ink);background:var(--light);display:block}
.dwrap{position:relative}
.dpz{position:absolute;left:42.85%;top:42.85%;width:14.3%;height:14.3%}
.promo{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-top:8px}
.promo button{width:66px;height:66px;padding:5px;background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.promo img.pz{width:100%;height:100%}
.score{display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;align-items:center;font-weight:650;
  font-size:15px;padding-top:4px}
.score>*{padding:11px 0;border-top:2px solid var(--rule)}
.score span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}

/* (portada antiga substituída) */
/* ===== menú inicial ===== */
.portada{position:fixed;inset:0;z-index:30;overflow:hidden;background:#F1E4C3}
.portada.off{display:none}

/* ===== fondo: cores planas puras, sen textura nin pixelado ===== */
.portada{--hz:46%}
@media (orientation:portrait) and (max-aspect-ratio:9/13){ .portada{--hz:53%} }
@media (orientation:landscape){ .portada{--hz:40%} }
.pbg{position:absolute;inset:0;overflow:hidden;background:#F1E4C3;animation:bgIn .8s ease both}
.pbg .sol{position:absolute;left:50%;bottom:var(--hz);width:min(52vw,330px);aspect-ratio:1;
  transform:translateX(-50%) translateY(38%);background:#F2B60D;border-radius:50%;
  animation:solIn .7s cubic-bezier(.2,.9,.3,1) .12s both}
@media (orientation:landscape){ .pbg .sol{width:min(30vh,260px)} }
@keyframes solIn{from{transform:translateX(-50%) translateY(38%) scale(0)}
  to{transform:translateX(-50%) translateY(38%) scale(1)}}
.pbg .tri{position:absolute;top:0;height:calc(100% - var(--hz));width:46%}
.pbg .tl{left:0;background:#D8322A;clip-path:polygon(0 26%,0 100%,100% 100%);
  animation:triL .6s cubic-bezier(.2,.9,.3,1) .26s both}
.pbg .tr{right:0;background:#0B7A47;clip-path:polygon(100% 26%,100% 100%,0 100%);
  animation:triR .6s cubic-bezier(.2,.9,.3,1) .26s both}
@keyframes triL{from{opacity:0;transform:translateX(-24%)}to{opacity:1;transform:translateX(0)}}
@keyframes triR{from{opacity:0;transform:translateX(24%)}to{opacity:1;transform:translateX(0)}}
.chan{position:absolute;left:0;right:0;bottom:0;width:100%;height:var(--hz);display:block;
  animation:chanIn .8s ease .32s both}
@keyframes chanIn{from{opacity:0}to{opacity:1}}
.portada{display:flex;flex-direction:column;align-items:center;gap:0}
/* 1 · título */
.ptit{flex:0 0 auto;width:100%;display:flex;justify-content:center;padding:3vh 16px 0;
  animation:titIn .55s cubic-bezier(.2,.9,.3,1) .15s both}
.ptit img{width:min(88%,620px);height:auto;max-height:20vh;object-fit:contain;display:block}
@keyframes titIn{from{opacity:0;transform:translateY(-34px)}to{opacity:1;transform:translateY(0)}}

/* 2 · figuras (ocupan o oco que sobra, e nunca o invaden as demais capas) */
.pfigs{flex:1 1 auto;min-height:0;width:100%;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:end;justify-items:center;gap:2vw;padding:2vh 5vw calc(var(--hz) * .40)}
/* as figuras son botóns, pero sen ningún chrome de botón */
.fig,.pmoto{background:none;background-color:transparent;border:0;padding:0;margin:0;
  color:inherit;font:inherit;text-transform:none;letter-spacing:0;-webkit-appearance:none;appearance:none}
.fig{flex:0 0 auto;overflow:visible;display:flex;flex-direction:column;align-items:center;gap:6px;
  opacity:0;animation:cae .6s cubic-bezier(.3,1.5,.5,1) both}
.fig:nth-child(1){animation-delay:.55s} .fig:nth-child(2){animation-delay:.72s}
.fig:nth-child(3){animation-delay:.89s}
@keyframes cae{0%{opacity:0;transform:translateY(-120px) rotate(-6deg)}
  70%{opacity:1;transform:translateY(8px) rotate(1deg)} 100%{opacity:1;transform:translateY(0) rotate(0)}}
.fig img:not(.lbl),.pmoto img:not(.lbl){display:block;height:auto;
  transition:transform .22s cubic-bezier(.2,.9,.3,1),filter .2s ease}
.fig:nth-child(1) img:not(.lbl){height:min(17vh,25vw,250px);width:auto}
.fig:nth-child(2) img:not(.lbl){height:min(21vh,19vw,300px);width:auto}
.fig:nth-child(3) img:not(.lbl){height:min(16vh,24vw,238px);width:auto}
.fig.alto{align-self:flex-end;margin-bottom:6vh;flex-direction:column-reverse}
/* bordo branco de pegatina, só ao resaltar */
.fig:hover img:not(.lbl),.fig:focus-visible img:not(.lbl),.fig.on img:not(.lbl),
.pmoto:hover img:not(.lbl),.pmoto:focus-visible img:not(.lbl),.pmoto.on img:not(.lbl){
  transform:translateY(-7px) scale(1.035);
  filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff)
         drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
         drop-shadow(2px 2px 0 #fff) drop-shadow(-2px -2px 0 #fff)
         drop-shadow(2px -2px 0 #fff) drop-shadow(-2px 2px 0 #fff)
         drop-shadow(0 10px 12px rgba(0,0,0,.25))}
.fig:focus,.pmoto:focus{outline:none}
.fig .lbl,.pmoto .lbl{height:clamp(20px,2.6vh,30px);width:auto;display:block;position:relative;z-index:1;
  filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff)
         drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff)
         drop-shadow(1.8px 1.8px 0 #fff) drop-shadow(-1.8px -1.8px 0 #fff)
         drop-shadow(1.8px -1.8px 0 #fff) drop-shadow(-1.8px 1.8px 0 #fff)
         drop-shadow(0 0 6px rgba(255,255,255,.9))}
/* a peza píntase por riba da etiqueta, para que o seu bordo branco non se corte */
.fig img:not(.lbl),.pmoto img:not(.lbl){position:relative;z-index:2}
.fig.alto{gap:10px}

/* 3 · descrición: ten a súa propia banda, non se superpón a nada */
.pdesc{flex:0 0 auto;width:100%;text-align:center;padding:10px 18px 2px;box-sizing:content-box;
  height:3.2em;overflow:hidden;
  -webkit-text-stroke:4px #fff; paint-order:stroke fill;
  text-shadow:0 0 6px #fff,1.5px 0 0 #fff,-1.5px 0 0 #fff,0 1.5px 0 #fff,0 -1.5px 0 #fff;
  font-family:var(--sans);font-size:13.5px;font-weight:500;line-height:1.4;color:#2A2822;
  opacity:0;transition:opacity .25s ease;pointer-events:none}
.pdesc.on{opacity:1}

/* 4 · moto: contida, nunca máis dun quinto da altura */
.pmoto{flex:0 0 auto;position:relative;width:100%;display:flex;flex-direction:column;
  align-items:center;gap:4px;justify-content:flex-end;
  animation:sobe .6s cubic-bezier(.2,.9,.3,1) 1.05s both}
@keyframes sobe{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:translateY(0)}}
.pmoto img:not(.lbl){height:min(17vh,38vw,300px);width:auto;margin-bottom:-1.5vh;order:2}
.pmoto .lbl{position:static;transform:none;order:1}

.ptoast{position:absolute;left:50%;top:46%;transform:translateX(-50%);background:#12141A;color:#F1E4C3;
  padding:10px 16px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.ptoast.on{opacity:1}

@media (orientation:landscape){
  .ptit{padding-top:2vh} .ptit img{width:min(40%,420px);max-height:17vh}
  .pfigs{gap:4vw;padding-top:0;padding-bottom:0;align-items:flex-end}
  .fig:nth-child(1) img:not(.lbl){height:min(20vh,15vw,210px)}

function pieceSVG(type,color,size){  // mantén o nome: devolve <img> da skin activa
  const sk=settings.skin||"xoguete";
  const rot=SKINS[sk].cenital?XIRO[color]:-(typeof S!=="undefined"&&S?boardRot():0);
  const esc=SKINS[sk].escala||1;
  const est=`width:${(esc*100).toFixed(0)}%;height:${(esc*100).toFixed(0)}%;object-fit:contain;display:block;`
          + (SKINS[sk].cenital?``:`align-self:flex-end;margin-bottom:${((1-esc)*50*0.4).toFixed(1)}%;`)
          + (rot?`transform:rotate(${rot}deg);`:``)
          + (SKINS[sk].cenital===false&&false?``:``)
          + (sk==="pixel"?`image-rendering:pixelated;`:``);
  return `<img class="pz" src="pezas/${sk}/${FICH[type]}_${color}.webp" alt="${L.piece[type]} ${nm(color)}" draggable="false" style="${est}">`;
}

let S=null, history=[], sel=null, legal=[], rearr=null, promoPending=null;
const inZone=(c,x,y)=>{const z=ZONE[c];return x>=z.x[0]&&x<=z.x[1]&&y>=z.y[0]&&y<=z.y[1];};
const isCorner=(x,y)=>CORNERS.some(([a,b])=>a===x&&b===y);
const inB=(x,y)=>x>=0&&x<N&&y>=0&&y<N;

function initialBoard(){
  const b=Array.from({length:N},()=>Array(N).fill(null));
  const put=(c,tp,x,y)=>{b[y][x]={t:tp,c,moved:false};};
  // Amarelo (abaixo): Rei, 2 Tanques, Artillería, Enxeñeiro, Motorista, 3 Metralladoras, 3 Gardiáns
  ["A","E","T","K","T","M","W","G"].forEach((p,i)=>put("Y",p,i+1,0));
  ["W","G","G","W"].forEach((p,i)=>put("Y",p,i+3,1));
  // Negro (arriba): igual pero 4 Metralladoras e 2 Gardiáns
  ["A","E","T","K","T","M","W","W"].forEach((p,i)=>put("B",p,i+1,9));
  ["W","G","G","W"].forEach((p,i)=>put("B",p,i+3,8));
  // Vermello (esquerda, aviación): 2 Avións, 2 Metralladoras, 2 Gardiáns
  put("R","P",0,3);put("R","W",0,4);put("R","W",0,5);put("R","P",0,6);put("R","G",1,4);put("R","G",1,5);
  // Verde (dereita, mariña): 2 Submarinos, 2 Metralladoras, 2 Gardiáns
  put("G","S",9,3);put("G","W",9,4);put("G","W",9,5);put("G","S",9,6);put("G","G",8,4);put("G","G",8,5);
  return b;
}
function newGame(){
  S={board:initialBoard(),turn:0,round:1,phase:"setup",ally:{Y:null,B:null,G:null,R:null},
     retired:{},skipNext:{},usedSkip:{},usedRearr:{Y:true},pending:null,outOfOrder:false,
     yellowAttacked:false,redNoPts:false,variant:settings.variant,log:[],last:null,over:null,pieces:0};
  if(S.variant){S.ally={Y:"B",B:"Y",G:"R",R:"G"};}
  if(BOTS.Y){ S.phase="play"; }
  history=[];sel=null;legal=[];rearr=null;
  Son.novaSerie();
  render();
}
const snapshot=()=>JSON.stringify(S);
const enemy=(a,b)=>a!==b&&S.ally[a]!==b;
const alliancesDone=()=>S.variant||(S.ally.G&&S.ally.R);

// devolve [{x,y,cap}] ; opts.diagram: inclúe casas de captura de peóns aínda que estean baleiras
function genMoves(b,x,y,opts={}){
  const p=b[y][x], c=p.c, out=[], size=opts.size||N;
  const ib=(i,j)=>i>=0&&i<size&&j>=0&&j<size;
  const add=(i,j,capOnly=false,quiet=false)=>{
    if(!ib(i,j)) return false;
    const q=b[j][i];
    if(!q){ if(!capOnly) out.push({x:i,y:j,cap:false}); else if(opts.diagram) out.push({x:i,y:j,cap:true,empty:true}); return true; }
    if(!quiet && enemy(c,q.c)) out.push({x:i,y:j,cap:true});
    return false;
  };
  const slide=dirs=>dirs.forEach(([dx,dy])=>{let i=x+dx,j=y+dy;while(add(i,j)){i+=dx;j+=dy;}});
  const step=dirs=>dirs.forEach(([dx,dy])=>add(x+dx,y+dy));
  const [fx,fy]=FWD[c];
  switch(p.t){
    case "K": step(ALL8); break;
    case "T": case "S": slide(ALL8); if(p.t==="S") step(KN); break;
    case "A": slide(ORTH); break;
    case "M": slide(DIAG); break;
    case "E": step(KN); break;
    case "P":{ const seen=new Set();
      KN.forEach(([a,b1])=>{const mx=x+a,my=y+b1; if(!ib(mx,my)) return;
        KN.forEach(([c2,d])=>{const i=mx+c2,j=my+d; if(!ib(i,j)||(i===x&&j===y)) return;
          const k=i+","+j; if(seen.has(k)) return; seen.add(k); add(i,j);});});
      break;}
    case "G":{ // peón: 1 (ou 2 desde a saída) cara adiante sen capturar; captura en diagonal cara adiante
      const i=x+fx,j=y+fy;
      if(ib(i,j)&&!b[j][i]){ out.push({x:i,y:j,cap:false});
        const i2=i+fx,j2=j+fy; if(!p.moved&&ib(i2,j2)&&!b[j2][i2]) out.push({x:i2,y:j2,cap:false}); }
      add(x+fx+fy,y+fy+fx,true); add(x+fx-fy,y+fy-fx,true);
      break;}
    case "W":{ // metralladora: coma o Rei (1 en calquera dirección) + 2 cara adiante na saída
      step(ALL8);
      const i=x+fx,j=y+fy,i2=i+fx,j2=j+fy;
      if(!p.moved&&ib(i,j)&&!b[j][i]&&ib(i2,j2)&&!b[j2][i2]) out.push({x:i2,y:j2,cap:false});
      break;}
  }
  if(!opts.diagram&&!alliancesDone()) return out.filter(m=>!isCorner(m.x,m.y));
  return out;
}
function findKing(b,c){for(let y=0;y<N;y++)for(let x=0;x<N;x++){const p=b[y][x];if(p&&p.c===c&&p.t==="K")return [x,y];}return null;}
function attacked(b,tx,ty,byEnemiesOf){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const p=b[y][x];
    if(!p||!enemy(p.c,byEnemiesOf)||S.retired[p.c]) continue;
    if(genMoves(b,x,y).some(m=>m.x===tx&&m.y===ty&&m.cap)) return true;}
  return false;
}
function inCheck(b,c){const k=findKing(b,c);return k?attacked(b,k[0],k[1],c):false;}
function applyMove(b,fx,fy,tx,ty){const nb=b.map(r=>r.map(p=>p?{...p}:null));const p=nb[fy][fx];nb[ty][tx]={...p,moved:true};nb[fy][fx]=null;return nb;}
function legalMoves(x,y){
  const b=S.board,p=b[y][x];
  return genMoves(b,x,y).filter(m=>{
    if(!GREATER[p.c]) return true;
    return !inCheck(applyMove(b,x,y,m.x,m.y),p.c);
  });
}
function hasLegal(c){const b=S.board;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const p=b[y][x];if(p&&p.c===c&&legalMoves(x,y).length)return true;}return false;}
function countPieces(c){let n=0;S.board.forEach(r=>r.forEach(p=>{if(p&&p.c===c)n++;}));return n;}
const cur=()=>ORDER[S.turn];
const promoLine=(c,x,y)=>({Y:y===9,B:y===0,R:x===9,G:x===0})[c];
const sqName=(x,y)=>FILES[x]+(y+1);

/* ---------------- alianzas ---------------- */
function setAlly(l,g,silent){
  if(S.ally[l]||S.ally[g]) return false;
  S.ally[l]=g; S.ally[g]=l;
  if(l==="R"&&g==="Y"&&S.round>=3) S.redNoPts=true;
  if(!silent){ note(t("msgAllied",{a:nm(l),b:nm(g)})); Son.ef("ally"); }
  return true;
}
const otherG=g=>g==="Y"?"B":"Y";
function canDeclare(l,g){
  if(S.variant||S.round>3||S.ally[l]||S.ally[g]) return false;
  if(l==="R"&&g==="Y"&&S.round===1&&!S.yellowAttacked) return false;
  return true;
}
// captura/xaque entre maior e menor nas 3 primeiras roldas → enemistade → alianza coa outra maior
function hostility(a,b){
  if(S.variant||S.round>3) return;
  const l=LESSER[a]?a:(LESSER[b]?b:null), g=GREATER[a]?a:(GREATER[b]?b:null);
  if(!l||!g) return;
  if(g==="Y") S.yellowAttacked=true;
  setAlly(l,otherG(g));
}

/* ---------------- quendas ---------------- */
function note(s){S.log.push({txt:s});}
function endTurnAfter(action){ // action: "move"|"pass"|"rearr"
  const me=cur();
  // xaque / mate
  let checkTarget=null;
  for(const g of ["Y","B"]){
    if(inCheck(S.board,g)){
      if(!hasLegal(g)){ gameOver("mate",g); return; }
      if(g!==me){ checkTarget=g; Son.ef("check"); if(action==="move") hostility(me,g); }
    }
  }
  // retirada de menores sen pezas
  for(const l of ["G","R"]) if(!S.retired[l]&&countPieces(l)===0){S.retired[l]=true;note(t("msgRetire",{p:nm(l)}));}
  if(S.variant&&S.retired.G&&S.retired.R){gameOver("lesserAll");return;}
  // seguinte xogador
  if(S.outOfOrder){S.skipNext[me]=true;S.outOfOrder=false;}
  S.pending=null;
  const natural=nextNatural();
  if(checkTarget&&checkTarget!==natural.color){
    S.pending=checkTarget; S.outOfOrder=true; S.turn=ORDER.indexOf(checkTarget);
    note(t("msgCheck",{p:nm(checkTarget)}));
  } else {
    if(checkTarget) note(t("msgInCheck",{p:nm(checkTarget)}));
    if(natural.wrap){ // remata a rolda
      if(!alliancesDone()&&S.round===3){gameOver("neutral");return;}
      S.round++;
    }
    S.turn=natural.idx;
  }
  // xogador sen xogadas legais (afogado) → pasa
  let guard=0;
  while(!S.pending&&!hasLegal(cur())&&countPieces(cur())>0&&guard++<4){note(t("msgPass",{p:nm(cur())}));const n=nextNatural();if(n.wrap)S.round++;S.turn=n.idx;}
  sel=null;legal=[];render();
  if(S.online) Rede.publicar();
}
function nextNatural(){
  let idx=S.turn, wrap=false;
  for(let k=0;k<8;k++){
    idx=(idx+1)%4; if(idx===0) wrap=true;
    const c=ORDER[idx];
    if(S.retired[c]) continue;
    if(S.skipNext[c]){S.skipNext[c]=false;continue;}
    return {idx,color:c,wrap};
  }
  return {idx:S.turn,color:cur(),wrap:false};
}
function gameOver(kind,who){
  S.over={kind,who}; S.phase="over"; Son.ef("end"); render(); showEnd();
  if(S.online) Rede.publicar();
}
function doMove(fx,fy,tx,ty,promo){
  history.push(snapshot()); if(history.length>40) history.shift();
  const p=S.board[fy][fx], tgt=S.board[ty][tx], me=p.c;
  Son.ef(tgt?"capture":"move");
  if(tgt){ note(t("msgCapture",{a:nm(me),t:L.piece[tgt.t],b:nm(tgt.c)})); hostility(me,tgt.c); }
  S.board=applyMove(S.board,fx,fy,tx,ty);
  if(promo) S.board[ty][tx].t=promo;
  S.last=[[fx,fy],[tx,ty]];
  S.log.push({mv:`${L.piece[p.t][0]}${sqName(fx,fy)}${tgt?"×":"–"}${sqName(tx,ty)}${promo?"="+L.piece[promo][0]:""}`,c:me});
  endTurnAfter("move");
}


/* ================= BOT =================
   Xoga en calquera posto. Non é un motor forte: é un xogador razoable.
   - Material e posición: valores por peza, avance, centro, seguridade do Rei.
   - Busca de 2 medias xogadas (a súa e a mellor resposta do inimigo máis
     perigoso), con poda simple: dá para non regalar pezas e para ver xaques.
   - Diplomacia: nas roldas 1-3 escolle aliado mirando cal das dúas potencias
     maiores está máis forte e menos ameazada, e evita atacar a quen quere
     como aliado. Vermello respecta a súa regra especial.
   - Un pouco de azar entre xogadas case iguais, para que non xogue sempre o
     mesmo e para que a partida non sexa previsible.                        */
const Bot=(()=>{
  const VAL={K:1000,T:9,S:10,A:5,E:3,M:3,W:2,G:1,P:6};
  const CENTRO=(x,y)=>{ const dx=Math.abs(x-4.5), dy=Math.abs(y-4.5); return 4-Math.max(dx,dy)*0.6; };

  function amigos(c){ return [c, S.ally[c]].filter(Boolean); }
  function ePercebido(c,o){ return c!==o && !amigos(c).includes(o); }

  // avaliación desde o punto de vista de `c` (positivo = bo para c)
  function evaluar(b,c){
    let s=0;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const p=b[y][x]; if(!p) continue;
      let v=VAL[p.t]*10 + CENTRO(x,y);
      // avance dos peóns e metralladoras
      if(p.t==="G"||p.t==="W"){ const [fx,fy]=FWD[p.c]; v+=(x*fx+y*fy)*0.4; }
      if(amigos(c).includes(p.c)) s+=v; else if(ePercebido(c,p.c)) s-=v;
    }
    // seguridade: rei propio en xaque, moi malo; rei inimigo en xaque, bo
    for(const g of ["Y","B"]){
      const k=findKing(b,g); if(!k) continue;
      const enX=attackedEnB(b,k[0],k[1],g);
      if(enX){
        if(amigos(c).includes(g)) s-=40;
        else if(ePercebido(c,g)){
          // cantas escapatorias lle quedan ao rei inimigo? cantas menos, máis preto do mate
          const bk=S.board; S.board=b;
          let escapes=0;
          for(let y=0;y<N&&escapes<4;y++)for(let x=0;x<N&&escapes<4;x++){
            const p=b[y][x]; if(p&&p.c===g&&legalMoves(x,y).length) escapes++;
          }
          S.board=bk;
          s+= escapes===0 ? 5000 : (escapes===1 ? 120 : 30);
        }
      }
      // rei inimigo con pouco espazo (encerrado) tamén vale
      if(ePercebido(c,g)){ const [kx,ky]=k; let libres=0;
        for(const [dx,dy] of ALL8){ const x=kx+dx,y=ky+dy; if(inB(x,y)&&!b[y][x]) libres++; }
        s+=(8-libres)*1.5; }
    }
    return s;
  }
  // attacked() usa S.board a través de genMoves(b,...): funciona con calquera b
  function attackedEnB(b,tx,ty,byEnemiesOf){ return attacked(b,tx,ty,byEnemiesOf); }

  function xogadasDe(b,c){
    const out=[];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const p=b[y][x]; if(!p||p.c!==c) continue;
      const bk=S.board; S.board=b;
      const ms=legalMoves(x,y);
      S.board=bk;
      for(const m of ms) out.push({fx:x,fy:y,tx:m.x,ty:m.y,cap:m.cap?b[m.y][m.x]:null,p});
    }
    return out;
  }
  function inimigoMaisPerigoso(c){
    // o rival con máis material que non sexa amigo
    let mellor=null, mx=-1;
    for(const o of ORDER){ if(!ePercebido(c,o)||S.retired[o]) continue;
      let m=0; S.board.forEach(r=>r.forEach(p=>{ if(p&&p.c===o) m+=VAL[p.t]; }));
      if(m>mx){ mx=m; mellor=o; } }
    return mellor;
  }
  function puntuar(c, mv){
    const b1=applyMove(S.board,mv.fx,mv.fy,mv.tx,mv.ty);
    // coroamento: sempre a Tanque
    if((mv.p.t==="G"||mv.p.t==="W")&&promoLine(c,mv.tx,mv.ty)) b1[mv.ty][mv.tx].t="T";
    let sc=evaluar(b1,c);
    // resposta do inimigo máis perigoso: a que máis nos doe
    const en=inimigoMaisPerigoso(c);
    if(en){
      const resp=xogadasDe(b1,en); let peor=Infinity;
      // limitar a 24 respostas máis prometedoras (capturas primeiro) por velocidade
      resp.sort((a,b)=>(b.cap?VAL[b.cap.t]:0)-(a.cap?VAL[a.cap.t]:0));
      for(const r of resp.slice(0,24)){
        const b2=applyMove(b1,r.fx,r.fy,r.tx,r.ty);
        const e=evaluar(b2,c); if(e<peor) peor=e;
      }
      if(peor<Infinity) sc=Math.min(sc, peor*0.9+sc*0.1);
    }
    // diplomacia: nas roldas 1-3 unha menor non ataca a quen prefire como aliado
    if(LESSER[c]&&S.round<=3&&!S.ally[c]&&mv.cap&&GREATER[mv.cap.c]&&mv.cap.c===aliadoPreferido(c)) sc-=60;
    // non dar voltas: se movemos a mesma peza que a última vez sen capturar, pequena penalización
    const ult=S.last; if(ult&&!mv.cap&&ult[1][0]===mv.fx&&ult[1][1]===mv.fy&&S.board[mv.fy][mv.fx].c===c) sc-=6;
    return sc + Math.random()*2.5;
  }
  function aliadoPreferido(l){
    // prefire a potencia maior máis forte que aínda estea libre
    const libres=["Y","B"].filter(g=>!S.ally[g]&&canDeclare(l,g));
    if(!libres.length) return null;
    const forza=g=>{ let m=0; S.board.forEach(r=>r.forEach(p=>{ if(p&&p.c===g) m+=VAL[p.t]; }));
      const k=findKing(S.board,g); if(k&&attacked(S.board,k[0],k[1],g)) m-=15; return m; };
    return libres.sort((a,b)=>forza(b)-forza(a))[0];
  }
  function decidirAlianza(c){
    if(!LESSER[c]||S.variant||S.ally[c]||S.round>3) return false;
    const g=aliadoPreferido(c); if(!g) return false;
    // declara na rolda 2 ou 3, ou na 1 se o rival xa lle quitou a outra opción
    const outra=g==="Y"?"B":"Y";
    if(S.round>=2 || S.ally[outra]){ setAlly(c,g); return true; }
    return false;
  }
  function xogar(){
    const c=cur(); if(S.phase!=="play"||S.over) return;
    if(decidirAlianza(c)) render();
    const xs=xogadasDe(S.board,c);
    if(!xs.length){ // sen xogadas: pasar se pode, senón nada (o motor xa o trata)
      if(!S.usedSkip[c]&&S.round<=3){ S.usedSkip[c]=true; note(t("msgPass",{p:nm(c)})); endTurnAfter("pass"); }
      return;
    }
    let mellor=null, mx=-Infinity;
    for(const mv of xs){ const sc=puntuar(c,mv); if(sc>mx){ mx=sc; mellor=mv; } }
    const promo=(mellor.p.t==="G"||mellor.p.t==="W")&&promoLine(c,mellor.tx,mellor.ty)?"T":null;
    doMove(mellor.fx,mellor.fy,mellor.tx,mellor.ty,promo);
  }
  return {xogar};
})();

/* quen controla cada posto: humano ou bot. En local, defínese ao empezar.
   En liña, o host marca postos como bot e é o seu dispositivo quen os move. */
let BOTS={Y:false,B:false,G:false,R:false};
let botTimer=null;
function eBot(c){ return !!BOTS[c]; }
function programarBot(){
  clearTimeout(botTimer);
  if(S.phase!=="play"||S.over) return;
  if(!eBot(cur())) return;
  if(S.online && !Rede.host) return;        // en liña só o host move os bots
  botTimer=setTimeout(()=>{ if(S.phase==="play"&&!S.over&&eBot(cur())) Bot.xogar(); }, 250+Math.random()*200);
}

/* ---------------- render ---------------- */
const $=id=>document.getElementById(id);
const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  renderBoard(); renderStatus(); renderPanel(); axustarTaboleiro(); programarBot();
}
function boardRot(){           // graos que xira o taboleiro en 1ª persoa
  if(settings.orient!=="1p"||S.phase==="over") return 0;
  const ref=(S.online&&Rede.posto)?Rede.posto:cur();
  return -XIRO[ref]||0;
}
function renderBoard(){
  const el=$("board"); el.innerHTML="";
  const tb=TABOLEIROS[settings.taboleiro]||TABOLEIROS.madeira;
  const br=boardRot();
  el.style.setProperty("--claro",tb.claro); el.style.setProperty("--escuro",tb.escuro);
  el.style.background=tb.imaxe ? `${tb.papel||"#fff"} url(${tb.imaxe}) center/100% 100% no-repeat` : "";
  el.style.borderColor=tb.bordo||tb.tinta;
  $("bframe").style.transform=br?`rotate(${br}deg)`:"";
  const rk=$("ranks"), fl=$("files");
  rk.innerHTML=""; fl.innerHTML="";
  if(settings.coords){
    const g=br?`transform:rotate(${-br}deg)`:"";
    for(let y=N-1;y>=0;y--) rk.insertAdjacentHTML("beforeend",`<span style="${g}">${y+1}</span>`);
    for(let x=0;x<N;x++)   fl.insertAdjacentHTML("beforeend",`<span style="${g}">${FILES[x]}</span>`);
  }
  const chk={}; for(const g of ["Y","B"]) if(S.phase!=="setup"&&inCheck(S.board,g)){const k=findKing(S.board,g); if(k) chk[k[0]+","+k[1]]=1;}
  for(let y=N-1;y>=0;y--) for(let x=0;x<N;x++){
    const d=document.createElement("div");
    d.className="sq "+((x+y)%2?"l":"d"); d.dataset.x=x; d.dataset.y=y;
    for(const c in ZONE) if(inZone(c,x,y)){
      const z=document.createElement("div");z.className="zone";z.style.background=COLORS[c];z.style.opacity=tb.zona;d.appendChild(z);
      // alianza: unha franxa fina da cor do aliado no lado interior da zona
      const al=S.ally[c];
      if(al&&!S.variant){ const f=document.createElement("div"); f.className="alia alia-"+c; f.style.background=COLORS[al]; d.appendChild(f); }
    }
    if(isCorner(x,y)&&!alliancesDone()){const z=document.createElement("div");z.className="corner";d.appendChild(z);}
    const p=S.board[y][x];
    if(p) d.insertAdjacentHTML("beforeend",pieceSVG(p.t,p.c));
    if(sel&&sel[0]===x&&sel[1]===y) d.classList.add("sel");
    if(S.last&&S.last.some(([a,b])=>a===x&&b===y)) d.classList.add("last");
    if(chk[x+","+y]) d.classList.add("check");
    const m=legal.find(m=>m.x===x&&m.y===y);
    if(m){const z=document.createElement("div");z.className=m.cap?"cap":"mv";d.appendChild(z);}
    if(rearr&&inZone(rearr.c,x,y)&&sel) d.classList.add("zonepick");
    d.addEventListener("click",()=>onSquare(x,y));
    el.appendChild(d);
  }
}
function chip(c,txt,cls){return `<span class="chip ${cls||""}"><span class="dot" style="background:${COLORS[c]}"></span>${txt}</span>`;}
function renderStatus(){
  let h="";
  if(S.phase==="setup") h=chip("Y",t("setup"));
  else if(S.phase==="over") h=`<span class="chip">${endTitleText()}</span>`;
  else { const nome=S.online?Rede.nomePosto(cur()):null;
    const etq=nome?`${nm(cur())} · ${esc(nome)}`:nm(cur());
    h=chip(cur(),etq,"now")+`<span class="chip rd">${t("round")} ${S.round}</span>`; }
  if(S.phase==="play"&&S.round<=3&&!S.variant){
    const av=avisoNeutral(cur());
    h+=`<span class="chip ph"${av?' style="background:var(--r);color:#fff"':''}>${av?t("coalUltima"):t("coalPhase")}</span>`;
  }
  $("status").innerHTML=h;
}
function coalText(){
  const a=S.ally;
  if(!a.G&&!a.R) return t("noCoal");
  const side=g=>nm(g)+(a[g]?" + "+nm(a[g]):" + ("+t("pending")+")");
  return side("Y")+" "+t("vs")+" "+side("B");
}
function avisoNeutral(me){
  if(S.variant||S.round!==3||S.phase!=="play"||!LESSER[me]||S.ally[me]) return false;
  // é a última quenda desta menor na rolda? (Verde móvese antes ca Vermello)
  // se son Vermello, é sempre a última; se son Verde, aviso igual por precaución
  return true;
}
function renderPanel(){
  const me=cur(), b=[];
  let msg="";
  if(S.phase==="setup") msg=t("msgSetup");
  else if(S.phase==="over") msg=endTitleText();
  else if(rearr) msg=t("msgRearr");
  else if(S.pending===me) msg=t("msgCheck",{p:nm(me)});
  else if(avisoNeutral(me)) msg=t("avisoNeutral");
  else msg=S.online?(Rede.posto?(Rede.podoMover()?t("tuaQuenda")+". "+t("msgMove"):t("quendaDe",{p:nm(cur())})):t("espectador")):t("msgMove");
  $("msg").textContent=msg;
  const par=(g)=>{ const a=S.ally[g];
    return `<span class="chip par"><span class="dot" style="background:${COLORS[g]}"></span>${nm(g)}`
         + (a?` <span class="mais">+</span><span class="dot" style="background:${COLORS[a]}"></span>${nm(a)}`:` <span class="pend">${t("pending")}</span>`)+`</span>`; };
  $("coal").innerHTML=S.variant
    ? `<span class="chip par"><span class="dot" style="background:${COLORS.G}"></span>${nm("G")} <span class="mais">+</span><span class="dot" style="background:${COLORS.R}"></span>${nm("R")}</span><span class="vs">${t("vs")}</span><span class="chip par"><span class="dot" style="background:${COLORS.Y}"></span>${nm("Y")} <span class="mais">+</span><span class="dot" style="background:${COLORS.B}"></span>${nm("B")}</span>`
    : (S.ally.G||S.ally.R) ? par("Y")+`<span class="vs">${t("vs")}</span>`+par("B") : `<span class="chip">${t("noCoal")}</span>`;
  const btn=(label,cls,fn,dis)=>{const x=document.createElement("button");x.textContent=label;if(cls)x.className=cls;x.disabled=!!dis;x.onclick=fn;b.push(x);};
  if(S.phase==="setup"){ if(!S.online||Rede.posto==="Y") btn(t("start"),"p",()=>{S.phase="play";sel=null;legal=[];render();if(S.online)Rede.publicar();}); }
  else if(S.phase==="play"){
    if(rearr){ btn(t("confirm"),"p",()=>{rearr=null;sel=null;S.usedRearr[me]=true;note(t("msgRearrDone",{p:nm(me)}));endTurnAfter("rearr");});
               btn(t("cancel"),"",()=>{S.board=rearr.board;rearr=null;sel=null;legal=[];render();}); }
    else{
      if(S.round<=3&&!S.pending){
        if(!S.variant&&LESSER[me]) for(const g of ["Y","B"]) btn(`${t("allyWith")} ${nm(g)}`,"",()=>{
            if(g==="Y"&&me==="R"&&S.round===3&&!confirm(t("msgRedNoPts"))) return;
            history.push(snapshot()); setAlly(me,g); render(); if(S.online)Rede.publicar();},!canDeclare(me,g)||!Rede.podoMover());
        btn(t("pass"),"",()=>{history.push(snapshot());S.usedSkip[me]=true;note(t("msgPass",{p:nm(me)}));endTurnAfter("pass");},
            S.usedSkip[me]||(me==="Y"&&S.round===1)||!Rede.podoMover());
        btn(t("rearr"),"",()=>{history.push(snapshot());rearr={c:me,board:S.board.map(r=>r.map(p=>p?{...p}:null))};sel=null;legal=[];render();},S.usedRearr[me]||!Rede.podoMover());
      }
      if(!S.online) btn(t("undo"),"ghost",()=>{if(history.length&&confirm(t("undoConfirm"))){S=JSON.parse(history.pop());sel=null;legal=[];rearr=null;render();}},!history.length);
    }
  } else { btn(t("newGame"),"p",()=>newGame()); }
  const a=$("actions"); a.innerHTML=""; b.forEach(x=>a.appendChild(x));
  $("log").innerHTML=S.log.slice(-14).map(e=>e.mv?`<span><b style="color:${e.c==="Y"?"#a67c00":COLORS[e.c]}">●</b> ${e.mv}</span>`:`<span style="width:100%;font-weight:700">${e.txt}</span>`).join("");
  $("log").scrollTop=1e6;
}
function endTitleText(){
  const o=S.over; if(!o) return "";
  if(o.kind==="mate") return t("endMate",{p:nm(o.who)});
  if(o.kind==="neutral") return t("endNeutral");
  if(o.kind==="lesserAll") return t("endLesserAll");
  return t("endDraw");
}
function showEnd(){
  const o=S.over, pts={Y:0,B:0,G:0,R:0}; let winners=[];
  if(o.kind==="mate"){ const loser=o.who, w=otherG(loser); winners=[w]; if(S.ally[w]) winners.push(S.ally[w]);
    if(S.variant) winners=["G","R"]; winners.forEach(c=>pts[c]=6); if(S.redNoPts&&winners.includes("R")) pts.R=0; }
  else if(o.kind==="neutral"){ for(const c of ORDER) if(S.ally[c]) pts[c]=1; }
  else if(o.kind==="lesserAll"){ winners=["Y","B"]; pts.Y=pts.B=6; }
  else { for(const c of ORDER) pts[c]=2; }
  $("endTitle").textContent=endTitleText();
  $("endText").textContent=winners.length?t("endWin",{w:winners.map(nm).join(" + ")}):"";
  $("endScore").innerHTML=ORDER.map(c=>`<span class="dot" style="background:${COLORS[c]}"></span><span>${nm(c)}</span><span>${pts[c]} ${t("points")}</span>`).join("");
  open("mEnd");
}

/* ---------------- interacción ---------------- */
function onSquare(x,y){
  if(S.phase==="over") return;
  if(S.phase==="play"&&eBot(cur())) return;
  if(S.online){ const p=Rede.posto; if(!p) return;
    if(S.phase==="setup"?p!=="Y":p!==cur()) return; }
  const p=S.board[y][x];
  // colocación / reorganización dentro da zona
  if(S.phase==="setup"||rearr){
    const c=S.phase==="setup"?"Y":rearr.c;
    if(!inZone(c,x,y)) return;
    if(sel){ const [sx,sy]=sel; const a=S.board[sy][sx]; const q=S.board[y][x];
      if(!(sx===x&&sy===y)){ S.board[y][x]=a; S.board[sy][sx]=q||null; }
      sel=null; Son.ef("place"); render(); return; }
    if(p&&p.c===c){ sel=[x,y]; render(); }
    return;
  }
  const me=cur();
  if(sel){
    const m=legal.find(m=>m.x===x&&m.y===y);
    if(m){ const [sx,sy]=sel, mp=S.board[sy][sx];
      if((mp.t==="G"||mp.t==="W")&&promoLine(mp.c,x,y)){ promoPending=[sx,sy,x,y]; showPromo(mp.c); return; }
      doMove(sx,sy,x,y); return; }
  }
  if(p&&p.c===me){ sel=[x,y]; legal=legalMoves(x,y);
    if(!legal.length&&!alliancesDone()&&genMoves(S.board,x,y,{diagram:true}).some(m=>isCorner(m.x,m.y))) $("msg").textContent=t("msgCorner");
  } else { sel=null; legal=[]; }
  render();
}
function showPromo(c){
  const opts=["T","A","E","M","P","S"], el=$("promoBtns"); el.innerHTML="";
  opts.forEach(tp=>{const b=document.createElement("button");b.innerHTML=pieceSVG(tp,c);b.title=L.piece[tp];
    b.onclick=()=>{close("mPromo");const [a,b2,c2,d]=promoPending;promoPending=null;doMove(a,b2,c2,d,tp);};el.appendChild(b);});
  open("mPromo");
}

/* ---------------- manual con diagramas ---------------- */
function diagram(type,c){
  const n=7, C=3;                       // 7x7: as frechas do bordo indican que segue
  const b=Array.from({length:n},()=>Array(n).fill(null)); b[C][C]={t:type,c,moved:false};
  const fwd=FWD[c]; FWD[c]=[0,1];       // nos diagramas a peza sempre avanza cara arriba
  const alyAntes=S?JSON.stringify(S.ally):null;
  if(S) S.ally={Y:"G",B:"R",G:"Y",R:"B"};
  const mv=genMoves(b,C,C,{diagram:true,size:n});
  if(S&&alyAntes) S.ally=JSON.parse(alyAntes);
  FWD[c]=fwd;
  const P=100, W=n*P;
  let s=`<svg viewBox="0 0 ${W} ${W}">`;
  for(let y=n-1;y>=0;y--)for(let x=0;x<n;x++){
    const X=x*P,Y=(n-1-y)*P;
    s+=`<rect x="${X}" y="${Y}" width="${P}" height="${P}" fill="${(x+y)%2?"#F4E6C3":"#CFAE7A"}"/>`;
    const m=mv.find(m=>m.x===x&&m.y===y);
    if(m){ if(m.cap) s+=`<circle cx="${X+50}" cy="${Y+50}" r="28" fill="none" stroke="#D8322A" stroke-width="11"/>`;
           else s+=`<circle cx="${X+50}" cy="${Y+50}" r="15" fill="#12141A" opacity=".62"/>`; }
  }
  // pezas deslizantes: frecha no bordo indicando que o movemento non ten límite
  const DIRS={T:ALL8, S:ALL8, A:ORTH, M:DIAG};
  if(DIRS[type]){
    for(const [dx,dy] of DIRS[type]){
      let i=C+dx, j=C+dy, ult=null;
      while(i>=0&&i<n&&j>=0&&j<n){ ult=[i,j]; i+=dx; j+=dy; }
      if(!ult) continue;
      const cx=ult[0]*P+50, cy=(n-1-ult[1])*P+50;
      const ang=Math.atan2(-dy,dx)*180/Math.PI;
      s+=`<g transform="translate(${cx},${cy}) rotate(${ang})">`
       + `<path d="M6,0 L40,0" stroke="#12141A" stroke-width="9" opacity=".75"/>`
       + `<path d="M34,-15 L46,0 L34,15 Z" fill="#12141A" opacity=".75"/></g>`;
    }
  }
  // avión: frechas do percorrido en dous saltos
  if(type==="P"){
    const a=(x,y)=>[x*P+50,(n-1-y)*P+50];
    const p0=a(C,C), p1=a(C+1,C+2), p2=a(C+3,C+3);
    s+=`<path d="M${p0[0]},${p0[1]} L${p1[0]},${p1[1]} L${p2[0]},${p2[1]}" fill="none"
         stroke="#12141A" stroke-width="9" stroke-dasharray="20 14" opacity=".8"/>`
     + `<circle cx="${p1[0]}" cy="${p1[1]}" r="12" fill="#12141A" opacity=".8"/>`;
  }
  s+=`</svg>`;
  return `<div class="dwrap">${s}<div class="dpz">${pieceSVG(type,c)}</div></div>`;
}
function boardDiagram(){
  let s=`<svg viewBox="0 0 1000 1000">`;
  for(let y=N-1;y>=0;y--)for(let x=0;x<N;x++){const X=x*100,Y=(N-1-y)*100;
    s+=`<rect x="${X}" y="${Y}" width="100" height="100" fill="${(x+y)%2?"#f4e6c3":"#cfae7a"}"/>`;
    for(const c in ZONE) if(inZone(c,x,y)) s+=`<rect x="${X}" y="${Y}" width="100" height="100" fill="${COLORS[c]}" opacity=".35"/>`;
    if(isCorner(x,y)) s+=`<rect x="${X}" y="${Y}" width="100" height="100" fill="url(#h)"/>`;
  }
  s=s.replace("<svg viewBox",`<svg viewBox`)+`<defs><pattern id="h" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="14" fill="#1b1b1b" opacity=".6"/></pattern></defs>`;
  // liñas de coroamento
  s+=`<rect x="0" y="0" width="1000" height="100" fill="none" stroke="#f2c300" stroke-width="12"/>`; // Y coroa arriba
  s+=`<rect x="0" y="900" width="1000" height="100" fill="none" stroke="#3d3d3d" stroke-width="12" stroke-dasharray="20 14"/>`;
  s+=`<rect x="900" y="0" width="100" height="1000" fill="none" stroke="#e0342b" stroke-width="12"/>`;
  s+=`<rect x="0" y="0" width="100" height="1000" fill="none" stroke="#2f9e44" stroke-width="12" stroke-dasharray="20 14"/>`;
  return s+"</svg>";
}

/* ================= SON =================
   Todo sintetizado en Web Audio: nin un byte de audio no paquete.
   A música constrúe unha serie dodecafónica propia en cada partida
   (as 12 notas antes de repetir ningunha) e vaina expoñendo lenta,
   alternando a serie orixinal coa súa inversión e o seu retrógrado.  */
const Son=(()=>{
  let ax=null, masterM=null, masterS=null, temp=null, serie=null;
  const listo=()=>{
    if(ax) return true;
    try{ ax=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return false; }
    masterM=ax.createGain(); masterM.gain.value=0;  masterM.connect(ax.destination);
    masterS=ax.createGain(); masterS.gain.value=.9; masterS.connect(ax.destination);
    return true;
  };
  const nova=()=>{ serie=serieNova(); fila=null; i=0; sec=null; ultSec=-1; };
  const hz=n=>261.63*Math.pow(2,n/12);
  function voz(f,t,dur,gain,tipo,dest){
    const o=ax.createOscillator(), g=ax.createGain(), lp=ax.createBiquadFilter();
    o.type=tipo||"triangle"; o.frequency.value=f;
    lp.type="lowpass"; lp.frequency.value=Math.min(6000,f*6);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain,t+dur*.18);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(lp); lp.connect(g); g.connect(dest||masterS);
    o.start(t); o.stop(t+dur+.05);
  }
  function ruido(t,dur,gain,corte,dest){
    const n=Math.floor(ax.sampleRate*dur), buf=ax.createBuffer(1,n,ax.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const src=ax.createBufferSource(); src.buffer=buf;
    const bp=ax.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=corte||1400; bp.Q.value=.9;
    const g=ax.createGain(); g.gain.value=gain;
    src.connect(bp); bp.connect(g); g.connect(dest||masterS); src.start(t);
  }
  /* ---- efectos ---- */
  const EF={
    move:   ()=>{ const t=ax.currentTime; ruido(t,.06,.18,1800); voz(196,t,.09,.05,"sine"); },
    place:  ()=>{ const t=ax.currentTime; ruido(t,.05,.14,2200); voz(262,t,.07,.04,"sine"); },
    capture:()=>{ const t=ax.currentTime; ruido(t,.16,.30,700); voz(98,t,.22,.10,"sawtooth"); voz(92.5,t,.22,.07,"sawtooth"); },
    check:  ()=>{ const t=ax.currentTime; voz(hz(0),t,.7,.10); voz(hz(1),t+.02,.7,.09); voz(hz(6),t+.04,.7,.08); },
    ally:   ()=>{ const t=ax.currentTime; if(!serie) nova();
                  [0,1,2].forEach((k,i)=>voz(hz(serie[k]),t+i*.11,.5,.11)); },
    end:    ()=>{ const t=ax.currentTime; if(!serie) nova();
                  serie.slice(0,6).forEach((n,i)=>voz(hz(n-12),t+i*.17,1.1,.10)); },
  };
  function ef(k){ if(!settings.sfx||!listo()||!EF[k]) return; ax.resume&&ax.resume(); EF[k](); }

    /* ---- música ----
     Dodecafonismo con desenvolvemento real, non un fondo plano.

     SERIE: en cada partida escóllese ao chou entre series históricas
     auténticas (Schönberg op. 25 e op. 33a, Berg do Concerto para violín,
     Webern op. 24) ou xérase unha nova que cumpre a regra: as doce alturas
     unha soa vez, evitando tríadas maiores/menores consecutivas para que non
     soe tonal.

     FORMA: a peza avanza por seccións encadeadas, cada unha co seu carácter,
     tempo e textura. Non se repite a orde, así que dúas partidas nunca soan
     igual, pero sempre hai contraste: momentos suspendidos, outros axitados.  */
  const SERIES_HISTORICAS=[
    [4,5,7,1,6,3,8,2,11,0,9,10],  // Schönberg, Suite op. 25
    [10,5,0,11,9,6,1,3,7,8,2,4],  // Schönberg, Klavierstück op. 33a
    [7,10,2,6,9,0,4,8,11,1,3,5],  // Berg, Concerto para violín
    [11,10,2,3,7,6,8,4,5,0,1,9],  // Webern, op. 24
  ];
  const FORMAS={
    P: f=>f,
    I: f=>f.map(n=>(12-n)%12),
    R: f=>[...f].reverse(),
    RI:f=>[...f].reverse().map(n=>(12-n)%12),
  };
  // seccións: [nome, pulso(s), notas por ataque, rexistro, dinámica, silencio]
  const SECCIONS=[
    {nome:"suspendido", pulso:1.15, voces:1, oct:[0,12],     gain:.13, sil:.9,  dur:3.6},
    {nome:"coral",      pulso:0.80, voces:3, oct:[-12,0,12], gain:.10, sil:.45, dur:2.8},
    {nome:"axitado",    pulso:0.26, voces:1, oct:[0,0,12],   gain:.15, sil:.05, dur:0.9},
    {nome:"baixo só",   pulso:0.95, voces:1, oct:[-24,-12],  gain:.16, sil:.7,  dur:3.2},
    {nome:"puntillista",pulso:0.55, voces:1, oct:[-12,0,12,24], gain:.12, sil:1.1, dur:1.4},
    {nome:"cadencia",   pulso:1.5,  voces:4, oct:[-12,0,12], gain:.09, sil:1.6, dur:5.0},
  ];
  const TIMBRES=["triangle","sine","triangle","sawtooth"];
  let fila=null, i=0, sec=null, compases=0, ultSec=-1;

  function serieNova(){
    if(Math.random()<.55) return [...SERIES_HISTORICAS[Math.floor(Math.random()*SERIES_HISTORICAS.length)]];
    // serie propia: 12 alturas, sen tríadas tonais seguidas
    for(let intento=0;intento<80;intento++){
      const a=[...Array(12).keys()];
      for(let k=11;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}
      let ok=true;
      for(let k=0;k<10;k++){
        const iv=[(a[k+1]-a[k]+12)%12,(a[k+2]-a[k+1]+12)%12];
        // evita maior/menor consecutivas (3+4 ou 4+3) e dúas quintas seguidas
        if((iv[0]===3&&iv[1]===4)||(iv[0]===4&&iv[1]===3)||(iv[0]===7&&iv[1]===7)) { ok=false; break; }
      }
      if(ok) return a;
    }
    return [0,1,4,2,3,6,5,8,7,10,9,11];
  }
  function novaFrase(){
    const k=["P","I","R","RI"][Math.floor(Math.random()*4)];
    const transp=Math.floor(Math.random()*12);
    fila=FORMAS[k](serie).map(n=>(n+transp)%12);
    i=0;
  }
  function novaSeccion(){
    let n; do{ n=Math.floor(Math.random()*SECCIONS.length); }while(n===ultSec&&SECCIONS.length>1);
    ultSec=n; sec=SECCIONS[n];
    compases=2+Math.floor(Math.random()*3);      // dura entre 2 e 4 voltas da serie
  }
  function nota(n,t,dur,gain,tipo,oct){
    const f=hz(n+(oct||0));
    const o=ax.createOscillator(), g=ax.createGain(), lp=ax.createBiquadFilter();
    o.type=tipo; o.frequency.value=f; o.detune.value=Math.random()*7-3.5;
    lp.type="lowpass"; lp.frequency.value=Math.min(5600,f*7); lp.Q.value=.5;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain,t+Math.min(.12,dur*.2));
    g.gain.linearRampToValueAtTime(gain*.5,t+dur*.62);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(lp); lp.connect(g); g.connect(masterM);
    const d=ax.createDelay(1.4), dg=ax.createGain();
    d.delayTime.value=.34+Math.random()*.26; dg.gain.value=.15;
    g.connect(d); d.connect(dg); dg.connect(masterM);
    o.start(t); o.stop(t+dur+.12);
  }
  function tic(){
    if(!ax||!settings.musica) return;
    if(!serie) nova();
    if(!sec) novaSeccion();
    if(!fila||i>=12){
      novaFrase();
      if(--compases<=0) novaSeccion();
    }
    const t=ax.currentTime+.04;
    const oct=()=>sec.oct[Math.floor(Math.random()*sec.oct.length)];

    // a voz principal expón a seguinte altura da serie
    nota(fila[i], t, sec.dur, sec.gain, TIMBRES[i%TIMBRES.length], oct());

    // voces adicionais: alturas seguintes da mesma serie, non notas alleas
    for(let v=1; v<sec.voces; v++){
      const n=fila[(i+v*3)%12];
      nota(n, t+v*.09, sec.dur*(1+v*.25), sec.gain*(.62-v*.08), TIMBRES[(i+v*2)%TIMBRES.length], oct());
    }
    // na sección axitada, algún golpe de acento
    if(sec.nome==="axitado" && Math.random()<.22)
      nota(fila[(i+1)%12], t+sec.pulso*.5, .22, sec.gain*.9, "sawtooth", 12);

    i++;
    const espera = sec.pulso*(0.82+Math.random()*0.4) + (Math.random()<.3 ? sec.sil : 0);
    temp=setTimeout(tic, espera*1000);
  }
  function musica(on){
    if(!listo()) return;
    ax.resume&&ax.resume();
    const t=ax.currentTime;
    masterM.gain.cancelScheduledValues(t);
    masterM.gain.linearRampToValueAtTime(on?.42:0, t+(on?2.2:.9));
    if(on){ if(!temp) tic(); } else { clearTimeout(temp); temp=null; }
  }
  return {ef, musica, novaSerie:nova,
          activar:()=>{ if(listo()&&settings.musica) musica(true); }};
})();

function axustarTaboleiro(){
  const w=$("boardwrap"); if(!w) return;
  const cs=getComputedStyle(w);
  const px=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
  const py=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const g=settings.coords?19:0, m=2;
  const lado=Math.max(140,Math.floor(Math.min(
      w.clientWidth-px-g-m, w.clientHeight-py-g-m)));
  $("bframe").style.setProperty("--lado",lado+"px");
  $("bframe").style.gridTemplateColumns=(settings.coords?19:0)+"px "+lado+"px";
  $("bframe").style.gridTemplateRows=lado+"px "+(settings.coords?19:0)+"px";
}
addEventListener("resize",axustarTaboleiro);

function debuxarChan(){
  const H=46, FILAS=14, COLS=19, k=1.6, x0=50, w0=32;  // w0 = medio ancho no horizonte
  const yF=j=>H*Math.pow(j/FILAS,k);
  const semi=y=>w0+(205-w0)*(y/H);
  let d="";
  for(let j=0;j<FILAS;j++){
    const y1=yF(j), y2=yF(j+1), s1=semi(y1), s2=semi(y2);
    for(let i=0;i<COLS;i++){
      if((i+j)%2) continue;
      const a1=x0-s1+2*s1*i/COLS, b1=x0-s1+2*s1*(i+1)/COLS;
      const a2=x0-s2+2*s2*i/COLS, b2=x0-s2+2*s2*(i+1)/COLS;
      d+=`M${a1.toFixed(2)},${y1.toFixed(2)}L${b1.toFixed(2)},${y1.toFixed(2)}`
       + `L${b2.toFixed(2)},${y2.toFixed(2)}L${a2.toFixed(2)},${y2.toFixed(2)}Z`;
    }
  }
  const sB=semi(H), yT=yF(0), sT=semi(yT);
  const base=`M${(x0-sT).toFixed(2)},${yT.toFixed(2)}L${(x0+sT).toFixed(2)},${yT.toFixed(2)}`
           + `L${(x0+sB).toFixed(2)},${H}L${(x0-sB).toFixed(2)},${H}Z`;
  $("chan").innerHTML=`<path d="${base}" fill="#F1E4C3"/>`
                     +`<path d="${d}" fill="#14161B" shape-rendering="crispEdges"/>`;
}

/* ================= EN LIÑA =================
   Adaptador de base de datos con dúas implantacións:
   - Firebase Realtime Database (produción, capa gratuíta). Pega a config en FIREBASE_CONFIG.
   - LocalDB: mesma máquina, entre pestanas, vía localStorage. Serve para probar sen Internet.
   O estado da partida sincronízase enteiro tras cada acción (poucos bytes, poucas xogadas). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAnMMvj4Xov7VMxjeaJNtr_Ca69i-ND4uA",
  databaseURL: "https://xadrezcoalicions-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "xadrezcoalicions"
};
const MAX_SALAS=20, SALA_INACTIVA_MS=30*60*1000;

const LocalDB=(()=>{                       // API mínima: get/set/update/push/onValue/off
  const K="xc-db"; const subs={};
  const leer=()=>JSON.parse(localStorage.getItem(K)||"{}");
  const gardar=d=>{localStorage.setItem(K,JSON.stringify(d));};
  const at=(d,p,crear)=>{const ps=p.split("/").filter(Boolean);let o=d;
    for(let i=0;i<ps.length-1;i++){if(o[ps[i]]==null){if(!crear)return[null,null];o[ps[i]]={};}o=o[ps[i]];}
    return [o,ps[ps.length-1]];};
  const get=async p=>{const [o,k]=at(leer(),p);return o?o[k]??null:null;};
  const set=async(p,v)=>{const d=leer();const [o,k]=at(d,p,true);if(v==null)delete o[k];else o[k]=v;gardar(d);notificar();};
  const update=async(p,obj)=>{const d=leer();for(const k in obj){const [o,kk]=at(d,p+"/"+k,true);if(obj[k]==null)delete o[kk];else o[kk]=obj[k];}gardar(d);notificar();};
  const push=async(p,v)=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);await set(p+"/"+id,v);return id;};
  const onValue=(p,fn)=>{(subs[p]=subs[p]||[]).push(fn);get(p).then(fn);};
  const off=p=>{delete subs[p];};
  const notificar=()=>{for(const p in subs)get(p).then(v=>subs[p].forEach(f=>f(v)));};
  window.addEventListener("storage",e=>{if(e.key===K)notificar();});
  return {get,set,update,push,onValue,off,nome:"local"};
})();

async function FirebaseDB(){
  const carga=src=>new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s);});
  await carga("https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js");
  await carga("https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js");
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database(app); const refs={};
  return {
    get:async p=>(await db.ref(p).get()).val(),
    set:async(p,v)=>db.ref(p).set(v),
    update:async(p,o)=>db.ref(p).update(o),
    push:async(p,v)=>(await db.ref(p).push(v)).key,
    onValue:(p,fn)=>{refs[p]=db.ref(p);refs[p].on("value",s=>fn(s.val()));},
    off:p=>{refs[p]&&refs[p].off();delete refs[p];},
    presenza:(p)=>{db.ref(p).onDisconnect().remove();db.ref(p).set(true);},
    nome:"firebase"};
}

const Rede=(()=>{
  let DB=null, sala=null, uid=null, meuPosto=null, host=false, aplicando=false, ultimaQuenda=null, reconectando=false;
  const L4=["Y","B","G","R"];
  const cod=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZ";let c="";for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];return c;};
  const meuUid=()=>{const q=new URLSearchParams(location.search).get("uid"); if(q) return q; /* só para probas */
    let u=localStorage.getItem("xc-uid");if(!u){u=Math.random().toString(36).slice(2,10);localStorage.setItem("xc-uid",u);}return u;};
  async function conectar(){
    if(DB) return DB;
    uid=meuUid();
    if(FIREBASE_CONFIG){ DB=await FirebaseDB(); } else { DB=LocalDB; }
    return DB;
  }
  async function limparEcontar(){
    let salas={};
    try{ salas=(await DB.get("rooms"))||{}; }
    catch(e){ console.warn("Non se puido ler a lista de salas (regras?)",e); return 0; }
    const agora=Date.now(); let n=0;
    for(const c in salas){ const r=salas[c];
      if(!r||!r.updated||agora-r.updated>SALA_INACTIVA_MS*2){ try{ await DB.set("rooms/"+c,null); }catch(e){} continue; }
      if(agora-r.updated<=SALA_INACTIVA_MS) n++; }
    return n;
  }
  async function crear(nome){
    await conectar();
    if((await limparEcontar())>=MAX_SALAS) throw new Error("chea");
    let c; do{ c=cod(); }while(await DB.get("rooms/"+c));
    await DB.set("rooms/"+c,{created:Date.now(),updated:Date.now(),host:uid,started:false,
      seats:{},nomes:{[uid]:nome},estado:null,chat:{}});
    return entrar(c,nome);
  }
  async function entrar(c,nome){
    await conectar(); c=c.toUpperCase().trim();
    const r=await DB.get("rooms/"+c); if(!r) throw new Error("cod");
    sala=c; host=r.host===uid; localStorage.setItem("xc-sala",c);
    reconectando=true;
    await DB.update("rooms/"+c,{["nomes/"+uid]:nome,updated:Date.now()});
    if(DB.presenza) DB.presenza(`rooms/${c}/online/${uid}`);
    DB.onValue("rooms/"+c, aoCambiar);
    return c;
  }
  async function sair(explicita){ if(!sala) return; DB.off("rooms/"+sala);
    // só se liberan o nome e o posto se saes a propósito da SALA DE ESPERA;
    // se hai partida en marcha, o posto consérvase para poder reincorporarte.
    if(explicita && !S.online){
      try{ await DB.update("rooms/"+sala,{["nomes/"+uid]:null}); }catch(e){}
      for(const p of L4) if(meuPosto===p) try{ await DB.set(`rooms/${sala}/seats/${p}`,null); }catch(e){}
    }
    sala=null; meuPosto=null; if(explicita) localStorage.removeItem("xc-sala"); }
  async function reclamar(p){ if(!sala) return;
    const seats=(await DB.get(`rooms/${sala}/seats`))||{};
    const upd={updated:Date.now()};
    if(seats[p]===uid){ upd["seats/"+p]=null; }         // toco o meu propio posto: solto
    else {
      if(seats[p]) return;                               // ocupado por outro: nada (o host usa liberar)
      for(const q of L4) if(seats[q]===uid) upd["seats/"+q]=null;  // deixo o anterior
      upd["seats/"+p]=uid;
    }
    await DB.update("rooms/"+sala,upd);
  }
  async function porBot(p){ if(!sala||!host) return;
    await DB.update("rooms/"+sala,{["seats/"+p]:"bot:"+p,["nomes/bot:"+p]:"🤖 "+t("bot"),updated:Date.now()}); }
  async function liberar(p){ if(!sala||!host) return;    // o host baleira calquera posto
    await DB.update("rooms/"+sala,{["seats/"+p]:null,updated:Date.now()});
  }
  async function sortear(){ if(!host) return;
    const r=await DB.get("rooms/"+sala); const seats=r.seats||{}; const nomes=r.nomes||{};
    const sen=Object.keys(nomes).filter(u=>!Object.values(seats).includes(u));
    const libres=L4.filter(p=>!seats[p]);
    for(let i=libres.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[libres[i],libres[j]]=[libres[j],libres[i]];}
    const upd={updated:Date.now()}; sen.forEach((u,i)=>{ if(libres[i]) upd["seats/"+libres[i]]=u; });
    await DB.update("rooms/"+sala,upd);
  }
  async function comezar(){ if(!host) return;
    const seats=(await DB.get(`rooms/${sala}/seats`))||{};
    for(const p of L4) BOTS[p]=String(seats[p]||"").startsWith("bot:");
    newGame(); S.online=true; S.sala=sala; S.bots={...BOTS};
    await DB.update("rooms/"+sala,{started:true,estado:JSON.stringify(S),updated:Date.now()});
  }
  async function publicar(){ if(!sala||!S.online||aplicando) return;
    await DB.update("rooms/"+sala,{estado:JSON.stringify(S),updated:Date.now()}); }
  async function chat(txt){ if(!sala||!txt.trim()) return;
    const nome=localStorage.getItem("xc-nome")||"?";
    await DB.push(`rooms/${sala}/chat`,{uid,nome,txt:txt.trim().slice(0,140),ts:Date.now()});
    await DB.update("rooms/"+sala,{updated:Date.now()}); }
  let r_=null;
  function aoCambiar(r){
    if(!r){ // sala pechada
      sair(); close("mSala"); $("chatWrap").hidden=true; mostrarPortada(true); return; }
    r_=r; host=r.host===uid;
    meuPosto=L4.find(p=>(r.seats||{})[p]===uid)||null;
    if(!r.started){ pintarSala(r); return; }
    // partida en marcha
    if(r.estado){ const novo=JSON.parse(r.estado);
      if(!S.online||JSON.stringify(S)!==r.estado){ aplicando=true; S=novo; S.online=true; S.sala=sala;
        if(S.bots) BOTS={...S.bots}; sel=null;legal=[];rearr=null; render(); aplicando=false; } }
    if($("mSala").classList.contains("open")){ close("mSala"); mostrarPortada(false); $("chatWrap").hidden=false; }
    pintarChat($("chatXogo"),r.chat);
    const q=cur(); if(q!==ultimaQuenda){ ultimaQuenda=q; if(q===meuPosto&&S.phase==="play") Son.ef("ally"); }
    document.getElementById("app").classList.toggle("turno-mio",meuPosto===cur()&&S.phase!=="over");
  }
  function pintarSala(r){
    $("salaCod").textContent=sala; const seats=r.seats||{}, nomes=r.nomes||{};
    $("seats").innerHTML=L4.map(p=>{const u=seats[p]; const mine=u===uid;
      const podeLiberar = host && u && !mine;
      const eBotU = String(u||"").startsWith("bot:");
      return `<div class="seatwrap">
        <button class="seat ${mine?"mine":""} ${u&&!mine?"taken":""}" data-p="${p}">
          <span class="dot" style="background:${COLORS[p]}"></span>
          <span><b>${nm(p)}</b><small>${u?(eBotU?"🤖 "+t("bot"):(nomes[u]||"?")+(mine?" ("+t("ti")+")":"")):t("libre")}</small></span>
          ${mine?`<span class="seatx" title="${t("soltar")}">✕</span>`:""}
        </button>
        ${podeLiberar?`<button class="seatlib" data-lib="${p}" title="${t("liberarP")}">✕</button>`:""}
        ${(host&&!u)?`<button class="seatbot" data-bot="${p}" title="${t("porBot")}">🤖</button>`:""}
      </div>`;}).join("");
    $("seats").querySelectorAll(".seatbot").forEach(b=>b.onclick=e=>{e.stopPropagation();porBot(b.dataset.bot);});
    $("seats").querySelectorAll(".seat").forEach(b=>b.onclick=()=>reclamar(b.dataset.p));
    $("seats").querySelectorAll(".seatlib").forEach(b=>b.onclick=e=>{e.stopPropagation();liberar(b.dataset.lib);});
    const cheos=L4.every(p=>seats[p]);
    $("salaComezar").disabled=!(host&&cheos); $("salaSortear").disabled=!host;
    $("salaComezar").title=host?"":t("salaSo");
    pintarChat($("chatSala"),r.chat);
    if(!$("mSala").classList.contains("open")){ close("mLina"); open("mSala"); }
  }
  function pintarChat(el,chat){ if(!el) return;
    const msgs=Object.values(chat||{}).sort((a,b)=>a.ts-b.ts).slice(-40);
    el.innerHTML=msgs.map(m=>`<div><b>${esc(m.nome)}</b> ${esc(m.txt)}</div>`).join("");
    el.scrollTop=1e6; }
  const podoMover=()=>!S.online||(meuPosto&&meuPosto===cur());
  function nomePosto(p){ if(!r_) return null; const u=(r_.seats||{})[p]; if(String(u||"").startsWith("bot:")) return "🤖 "+t("bot"); return u?(r_.nomes||{})[u]||null : null; }
  return {conectar,crear,entrar,sair,reclamar,liberar,sortear,comezar,publicar,chat,podoMover,nomePosto,
          get posto(){return meuPosto;},get sala(){return sala;},get host(){return host;}};
})();
